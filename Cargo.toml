[package]
name = "ai-board"
version = "0.1.0"
edition = "2021"
description = "SQLite-backed orchestration board for agentic development (abd CLI)"
license = "MIT"
repository = "https://github.com/backroomlabs/ai-board"

[[bin]]
name = "abd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serde_yaml = "0.9"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
agent-client-protocol = "=0.10.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
